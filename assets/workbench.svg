<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" role="img" aria-label="The Workbench: four projects, one method. SCF Protocol (HD, top of course), Achievia (Top 20 of 200), WWS (ADC semifinalist), APEC Water (Distinction).">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6ffb"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="1184" height="524" rx="18" fill="#0b0f17" stroke="#1c2431" stroke-width="1"/>

  <!-- header -->
  <circle cx="54" cy="60" r="4" fill="#3f9bff">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="68" y="65" fill="#3f9bff" font-size="15" letter-spacing="3">THE WORKBENCH</text>
  <text x="50" y="120" fill="#e8edf5" font-size="44" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Four projects. One method.</text>
  <text x="52" y="156" fill="#7c8698" font-size="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Find the real user pain, frame it, and demo an answer that ships.</text>

  <!-- ===== CARD 1 : SCF ===== -->
  <g>
    <rect x="50" y="196" width="260" height="316" rx="12" fill="#0f141f" stroke="#1e2735" stroke-width="1"/>
    <text x="68" y="228" fill="#6b7688" font-size="13" letter-spacing="1">SCF-PROTOCOL</text>
    <text x="292" y="228" fill="#3ddc84" font-size="12" text-anchor="end" letter-spacing="1">HD · TOP</text>
    <line x1="68" y1="240" x2="292" y2="240" stroke="#1e2735" stroke-width="1"/>
    <rect x="68" y="266" width="224" height="7" rx="3.5" fill="#1b2434"/>
    <rect x="68" y="266" width="0" height="7" rx="3.5" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="213" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="68" y="292" fill="#59637a" font-size="11">pain → framed → shipped</text>
    <circle cx="72" cy="320" r="4" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="84" y="324" fill="#6b7688" font-size="12">live</text>
    <text x="68" y="372" fill="#e8edf5" font-size="20" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">SCF Protocol</text>
    <text x="68" y="400" fill="#8b95a6" font-size="13">Blockchain supply-chain</text>
    <text x="68" y="420" fill="#8b95a6" font-size="13">finance for exporters</text>
  </g>

  <!-- ===== CARD 2 : Achievia ===== -->
  <g>
    <rect x="330" y="196" width="260" height="316" rx="12" fill="#0f141f" stroke="#1e2735" stroke-width="1"/>
    <text x="348" y="228" fill="#6b7688" font-size="13" letter-spacing="1">ACHIEVIA</text>
    <text x="572" y="228" fill="#3ddc84" font-size="12" text-anchor="end" letter-spacing="1">TOP 20 / 200</text>
    <line x1="348" y1="240" x2="572" y2="240" stroke="#1e2735" stroke-width="1"/>
    <rect x="348" y="266" width="224" height="7" rx="3.5" fill="#1b2434"/>
    <rect x="348" y="266" width="0" height="7" rx="3.5" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="197" dur="1.4s" begin="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="348" y="292" fill="#59637a" font-size="11">pain → framed → shipped</text>
    <circle cx="352" cy="320" r="4" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="364" y="324" fill="#6b7688" font-size="12">live</text>
    <text x="348" y="372" fill="#e8edf5" font-size="20" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Achievia</text>
    <text x="348" y="400" fill="#8b95a6" font-size="13">AI study-abroad guidance</text>
    <text x="348" y="420" fill="#8b95a6" font-size="13">for Vietnamese students</text>
  </g>

  <!-- ===== CARD 3 : WWS ===== -->
  <g>
    <rect x="610" y="196" width="260" height="316" rx="12" fill="#0f141f" stroke="#1e2735" stroke-width="1"/>
    <text x="628" y="228" fill="#6b7688" font-size="13" letter-spacing="1">WWS</text>
    <text x="852" y="228" fill="#3ddc84" font-size="12" text-anchor="end" letter-spacing="1">SEMIFINALIST</text>
    <line x1="628" y1="240" x2="852" y2="240" stroke="#1e2735" stroke-width="1"/>
    <rect x="628" y="266" width="224" height="7" rx="3.5" fill="#1b2434"/>
    <rect x="628" y="266" width="0" height="7" rx="3.5" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="179" dur="1.4s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="628" y="292" fill="#59637a" font-size="11">pain → framed → shipped</text>
    <circle cx="632" cy="320" r="4" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="644" y="324" fill="#6b7688" font-size="12">live</text>
    <text x="628" y="372" fill="#e8edf5" font-size="20" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WWS</text>
    <text x="628" y="400" fill="#8b95a6" font-size="13">Web accessibility for</text>
    <text x="628" y="420" fill="#8b95a6" font-size="13">HR and disability</text>
  </g>

  <!-- ===== CARD 4 : APEC Water ===== -->
  <g>
    <rect x="890" y="196" width="260" height="316" rx="12" fill="#0f141f" stroke="#1e2735" stroke-width="1"/>
    <text x="908" y="228" fill="#6b7688" font-size="13" letter-spacing="1">APEC-WATER</text>
    <text x="1132" y="228" fill="#3ddc84" font-size="12" text-anchor="end" letter-spacing="1">DISTINCTION</text>
    <line x1="908" y1="240" x2="1132" y2="240" stroke="#1e2735" stroke-width="1"/>
    <rect x="908" y="266" width="224" height="7" rx="3.5" fill="#1b2434"/>
    <rect x="908" y="266" width="0" height="7" rx="3.5" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="190" dur="1.4s" begin="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="908" y="292" fill="#59637a" font-size="11">pain → framed → shipped</text>
    <circle cx="912" cy="320" r="4" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="924" y="324" fill="#6b7688" font-size="12">live</text>
    <text x="908" y="372" fill="#e8edf5" font-size="20" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">APEC Water</text>
    <text x="908" y="400" fill="#8b95a6" font-size="13">Digital-transformation</text>
    <text x="908" y="420" fill="#8b95a6" font-size="13">blueprint for operations</text>
  </g>

  <!-- sweeping scan line -->
  <rect y="8" width="170" height="524" fill="url(#scan)">
    <animate attributeName="x" from="-170" to="1192" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
